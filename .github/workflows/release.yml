name: Release Glance (Universal macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal Glance.app & package ZIP + DMG
        run: |
          chmod +x build_app.sh
          ./build_app.sh --skip-install --package
          file Glance.app/Contents/MacOS/Glance
          ls -lh Glance-macOS-Universal.zip Glance-macOS-Universal.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v1.0.0"
          fi
          gh release create "${TAG}" \
            Glance-macOS-Universal.dmg \
            Glance-macOS-Universal.zip \
            --title "Glance ${TAG}" \
            --notes "Universal macOS release (Apple Silicon + Intel, macOS 14.0+). No Xcode required — drag **Glance.app** into **Applications**, open it once (System Settings → Privacy & Security → Open Anyway if prompted by Gatekeeper), and enable Accessibility + Screen Recording." \
            || gh release upload "${TAG}" Glance-macOS-Universal.dmg Glance-macOS-Universal.zip --clobber
